[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fuzzgen"
dynamic = ["version"]
description = "Fuzz-harness orchestrator: probe a parser entry point, emit a harness, seed a corpus, run contained fuzzing, dedup crashes, measure resource blowups"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["cramjam>=2.8,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fuzzgen = "fuzzgen.cli:main"

[tool.hatch.version]
path = "src/fuzzgen/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fuzzgen"]

[tool.hatch.build.targets.wheel.force-include]
"src/fuzzgen/templates" = "fuzzgen/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["dist", "build", "docs", "fuzzgen-out", "fuzzgen-work", "bin"]
markers = [
    "slow: tests that fuzz for tens of seconds",
]
